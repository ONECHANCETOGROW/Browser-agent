<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCTG Browser Agent</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1>OCTG BROWSER AGENT</h1>
    <span id="badge" class="badge idle">idle</span>
  </header>

  <nav id="mainTabs" class="main-tabs" role="tablist" aria-label="Sections">
    <button type="button" class="mtab" role="tab" data-tab="task" aria-selected="true">Task</button>
    <button type="button" class="mtab" role="tab" data-tab="ask" aria-selected="false">Ask</button>
    <button type="button" class="mtab" role="tab" data-tab="inbox" aria-selected="false">Inbox <span id="inboxCount" class="count" hidden>0</span></button>
  </nav>
  <div id="inboxBanner" class="inbox-banner" hidden>
    <span id="inboxBannerText"></span> <button type="button" id="inboxOpen" class="link">Open Inbox</button>
  </div>

  <div id="tab-task">
  <section class="card">
    <label for="model">Model</label>
    <select id="model"><option value="auto">Auto (local first)</option></select>
    <label for="taskInput">Task</label>
    <div class="taskbox">
      <textarea id="taskInput" rows="3" placeholder="Tell the agent what to do in this browser…"></textarea>
      <button id="mic" type="button" class="mic" data-state="idle" aria-pressed="false" aria-label="Start voice input" title="Start voice input">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </button>
    </div>
    <div id="voiceStatus" class="voice-status" role="status" aria-live="polite" hidden></div>
    <div class="voice-actions">
      <button id="voiceInstall" type="button" class="link" hidden>Install on-device speech model</button>
      <button id="voicePermission" type="button" class="link" hidden>Allow microphone…</button>
    </div>
    <label class="voice-opt"><input type="checkbox" id="voiceAutorun" checked> Run automatically after speaking</label>
    <div id="bizTaskRow" class="biz-task" hidden>
      <label for="bizMode">Business Brain</label>
      <select id="bizMode">
        <option value="auto">Auto (use it when the task is about my business)</option>
        <option value="on">On for this task</option>
        <option value="off">Off for this task</option>
      </select>
      <label for="bizClient">Client</label>
      <select id="bizClient"><option value="auto">Client: auto (only if the wording names exactly one)</option><option value="me">My own business</option></select>
      <div id="bizChip" class="muted" hidden></div>
    </div>
    <div class="row">
      <button id="run">Run</button>
      <button id="pause" class="secondary" hidden>Pause</button>
      <button id="resume" class="secondary" hidden>Resume</button>
      <button id="stop" class="danger" hidden>Stop</button>
    </div>
    <div id="toast" class="toast" hidden></div>
  </section>

  <section id="approval" class="approval" hidden>
    <div class="approval-title">Approval needed</div>
    <div id="approvalText"></div>
    <div id="approvalRisk" class="muted"></div>
    <div class="row">
      <button id="approve">Approve</button>
      <button id="deny" class="secondary">Deny</button>
    </div>
  </section>

  <section id="waiting" class="waiting" hidden>
    <div class="approval-title">Waiting for you</div>
    <div id="waitingText"></div>
    <div id="clientPick" class="row" hidden><select id="clientPickSel"></select><button id="clientPickBtn" class="secondary">Use this client</button></div>
    <div class="row"><button id="ready">I'm done — continue</button></div>
  </section>

  <section class="grid">
    <div><label>Status</label><div id="status">—</div></div>
    <div><label>Agent</label><div id="agentStatus">—</div></div>
    <div class="wide"><label>Current task</label><div id="task">—</div></div>
    <div><label>Current website</label><div id="website">—</div></div>
    <div><label>Current tab</label><div id="tabId">—</div></div>
    <div class="wide"><label>Current action</label><div id="action">—</div></div>
    <div class="wide"><label>URL</label><div id="url" class="mono">—</div></div>
    <div class="wide"><label>Page title</label><div id="title">—</div></div>
    <div><label>Browser</label><div id="browserStatus">—</div></div>
    <div><label>Model use</label><div id="usage">—</div></div>
  </section>

  <div id="restricted" class="warn" hidden></div>
  <div id="result" class="result" hidden></div>

  <details id="conn">
    <summary>Connection</summary>
    <label for="agentUrl">Agent URL (localhost only)</label>
    <input id="agentUrl" type="text" spellcheck="false" autocomplete="off">
    <label for="token">Pairing token <small>(run <code>python -m octg_agent token</code>)</small></label>
    <input id="token" type="password" spellcheck="false" autocomplete="off" placeholder="paste token to change">
    <div class="row">
      <button id="connect">Connect</button>
      <button id="disconnect" class="secondary">Disconnect</button>
    </div>
    <div id="connMsg" class="muted"></div>
  </details>

  <details id="biz" class="biz" hidden>
    <summary>Business Brain</summary>
    <div id="bizTabs" class="biz-tabs" role="tablist"></div>
    <div id="bizMsg" class="muted" hidden></div>
    <div id="bizBody"></div>
  </details>

  <section>
    <div class="row between"><h2>Activity</h2><button id="clear" class="link">clear view</button></div>
    <ol id="log"></ol>
  </section>
  </div>

  <div id="tab-ask" hidden><div id="askBody"></div></div>
  <div id="tab-inbox" hidden><div id="inboxBody"></div></div>

  <script src="stt.js"></script>
  <script src="voice_ui.js"></script>
  <script src="biz_ui.js"></script>
  <script src="ask_ui.js"></script>
  <script src="panel.js"></script>
</body>
</html>
